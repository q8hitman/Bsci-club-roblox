<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="Segoe UI, Tahoma, Arial" direction="rtl">
  <rect width="900" height="1100" fill="#f6f3ec"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1c2a3a">مخطط كلية العلوم (Blockout v32) — منظر علوي</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#556">1 خانة = 20 ستد • الشمال لفوق • ✅ مؤكد من الصور/المراجع • ⚠️ تقريبي</text>

  <!-- north arrow -->
  <g transform="translate(70,120)"><polygon points="0,-28 10,6 0,0 -10,6" fill="#1c2a3a"/><text x="0" y="26" text-anchor="middle" font-size="14">N</text></g>

  <!-- NORTH building (113) -->
  <rect x="290" y="110" width="360" height="260" fill="#cfe3ea" stroke="#2b5f74" stroke-width="3"/>
  <text x="470" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4556">المبنى الشمالي (113)</text>
  <text x="470" y="175" text-anchor="middle" font-size="13" fill="#1d4556">✅ واجهة زجاج + زعانف معدنية عمودية • ⚠️ التوزيع الداخلي تقريبي</text>
  <rect x="300" y="290" width="40" height="56" fill="#9fb2bb"/><text x="320" y="282" text-anchor="middle" font-size="11">سلالم</text>
  <rect x="610" y="290" width="40" height="56" fill="#9fb2bb"/><text x="630" y="282" text-anchor="middle" font-size="11">سلالم</text>
  <rect x="380" y="200" width="120" height="96" fill="#e9f3f6" stroke="#7aa" stroke-dasharray="6 4"/><text x="440" y="252" text-anchor="middle" font-size="12">أتريوم بسقف زجاجي</text>
  <text x="470" y="362" text-anchor="middle" font-size="12" fill="#1d4556">مدخل شمالي ↓ + جدار حجري "كلية العلوم"</text>

  <!-- galleria / garden between -->
  <rect x="270" y="370" width="400" height="320" fill="#d9ead0" stroke="#6b8f5a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="470" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#3c5e2e">الممشى / الجاليريا بين المبنيين</text>
  <path d="M390,690 C340,620 390,560 460,540 S560,470 520,400" fill="none" stroke="#8a8a86" stroke-width="12"/>
  <rect x="290" y="370" width="40" height="320" fill="#c45a3e" opacity="0.85"/><text x="310" y="530" text-anchor="middle" font-size="12" fill="#fff" transform="rotate(-90 310 530)">الممر الأحمر (جسر الدور الأول)</text>
  <!-- raised faculty club -->
  <path d="M455,470 A70,70 0 1,1 455,610" fill="#ffffff" stroke="#b8b0a0" stroke-width="10"/>
  <circle cx="490" cy="540" r="44" fill="#86c27a" stroke="#4f8a45" stroke-width="3"/>
  <text x="490" y="534" text-anchor="middle" font-size="12" font-weight="700">نادي الهيئة المرتفع</text>
  <text x="490" y="552" text-anchor="middle" font-size="11">بلكونات منحنية + حديقة سطح</text>
  <text x="490" y="628" text-anchor="middle" font-size="11" fill="#555">✅ الشكل • ⚠️ الموقع والمقاس تقريبي</text>
  <polygon points="600,480 640,470 650,505 610,512" fill="#fff" stroke="#999"/><text x="628" y="528" text-anchor="middle" font-size="11">ساحة الأشرعة</text>

  <!-- SOUTH building (114) -->
  <rect x="250" y="690" width="400" height="300" fill="#e7d8c4" stroke="#8a5a36" stroke-width="3"/>
  <text x="450" y="730" text-anchor="middle" font-size="20" font-weight="700" fill="#5a3a20">المبنى الجنوبي (114) — المدخل الرئيسي</text>
  <rect x="270" y="900" width="44" height="60" fill="#b9a68c"/><text x="292" y="892" text-anchor="middle" font-size="11">سلالم</text>
  <rect x="586" y="900" width="44" height="60" fill="#b9a68c"/><text x="608" y="892" text-anchor="middle" font-size="11">سلالم</text>
  <rect x="340" y="780" width="220" height="110" fill="#f5efe4" stroke="#aa9" stroke-dasharray="6 4"/>
  <text x="450" y="820" text-anchor="middle" font-size="13">البهو المفتوح + سقف زجاجي</text>
  <text x="450" y="840" text-anchor="middle" font-size="11">أسطوانات ستيل • دور الميزان • سلالم كهربائية</text>
  <text x="450" y="860" text-anchor="middle" font-size="11">مطاعم خلفية (Old Friends / Burger King / Second Cup)</text>
  <!-- facade layers -->
  <rect x="250" y="975" width="400" height="15" fill="#a86a40"/>
  <rect x="345" y="975" width="210" height="15" fill="#e8f2f4" stroke="#7aa"/>
  <text x="450" y="1010" text-anchor="middle" font-size="12" fill="#5a3a20">✅ ستارة برونزية مثقبة ومشطوفة (الأطراف) • ✅ وسط: أعمدة بيضاء طويلة + زجاج بلوفرات أفقية</text>
  <g fill="#fff" stroke="#8a7a6a"><circle cx="365" cy="985" r="5"/><circle cx="400" cy="985" r="5"/><circle cx="435" cy="985" r="5"/><circle cx="470" cy="985" r="5"/><circle cx="505" cy="985" r="5"/><circle cx="540" cy="985" r="5"/></g>

  <!-- plaza + parking -->
  <rect x="200" y="1020" width="500" height="40" fill="#e6dccb"/>
  <text x="450" y="1045" text-anchor="middle" font-size="13">✅ ساحة حجر فاتح + صف نخيل + حجر "114 كلية العلوم" • الجاليريا الأكاديمية من المواقف للمدخل ↑</text>
  <rect x="200" y="1065" width="500" height="25" fill="#6f7279"/><text x="450" y="1083" text-anchor="middle" font-size="12" fill="#fff">الشارع ← مواقف السيارات (جنوب)</text>
  <line x1="450" y1="1065" x2="450" y2="995" stroke="#2b7" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b7"/></marker></defs>

  <!-- legend -->
  <text x="860" y="1080" text-anchor="end" font-size="11" fill="#777">خارج النطاق (ما ينبنى): كلية الهندسة غرب، العلوم الحياتية والإدارية شرق</text>
</svg>
